- lead: We talk.
  text: You tell me what the piece needs, and I scope the work before it starts.
- lead: I sketch.
  text: Early mockups against picture or a rough demo, so we agree on direction before the detail.
- lead: We revise.
  text: I work from your notes, and re-adapt the music when the cut changes.
- lead: I deliver.
  text: Clearly named, organised files, checked against your delivery specs before they go out.
